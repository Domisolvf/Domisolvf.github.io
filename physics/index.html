<style>
/* Layout: one sheet of millimetre paper; a technique is a "card" pinned to it, answers sit on a ruled baseline */
:root {
  --paper: #f4f7f5;
  --grid-fine: #e2ece7;
  --grid: #cfe0d8;
  --sheet: #ffffff;
  --text: #17231f;
  --muted: #5a6b65;
  --line: #d2ddd8;
  --accent: #0e6f62;
  --accent-soft: #e0f1ec;
  --warn: #b8461a;
  --warn-soft: #fbece4;
  --ok: #217a43;
  --ok-soft: #e3f3e8;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1513; --grid-fine: #151d1a; --grid: #1b2622; --sheet: #151d1a; --text: #e3ece8; --muted: #93a59e;
    --line: #2a3833; --accent: #5cc9b5; --accent-soft: #17332d; --warn: #ff8f5e; --warn-soft: #3a2219;
    --ok: #6bd394; --ok-soft: #17321f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1513; --grid-fine: #151d1a; --grid: #1b2622; --sheet: #151d1a; --text: #e3ece8; --muted: #93a59e;
  --line: #2a3833; --accent: #5cc9b5; --accent-soft: #17332d; --warn: #ff8f5e; --warn-soft: #3a2219;
  --ok: #6bd394; --ok-soft: #17321f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-fine) 1px, transparent 1px), linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
  color: var(--text); font-family: var(--f-ui); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 16px; }
h1 { font: 600 26px/1.15 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; }
.stats { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font: 500 15px var(--f-ui); color: var(--muted); background: transparent; border: 1px solid transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--accent); border-color: var(--line); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px 26px; min-width: 0; box-shadow: 0 12px 30px -22px rgba(10, 40, 30, .45); }
@media (max-width: 560px) { .sheet { padding: 18px 16px 22px; } }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
select { font: 14px var(--f-ui); color: var(--text); background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
label.lbl { font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.ptext { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.choice {
  text-align: left; font: 500 15px/1.35 var(--f-ui); color: var(--text); background: var(--sheet);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 56px;

.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { cursor: default; }
.choice.bad { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); text-decoration: line-through; }

.fb { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.box { border-radius: 10px; padding: 12px 14px; border: 1.5px dashed var(--line); }
.box h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.box p { margin: 0; max-width: 65ch; }
.box p + p { margin-top: 6px; }
.box.warn { border-color: var(--warn); background: var(--warn-soft); }
.box.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.box .k { font: 600 12px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.box.warn .k { color: var(--warn); }
.box.ok .k { color: var(--ok); }

.answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.answer input {
  font: 500 22px var(--f-mono); color: var(--text); background: transparent; border: 0; border-bottom: 2px solid var(--text);
  width: 9ch; padding: 4px 2px; font-variant-numeric: tabular-nums;
}
.answer input:focus { outline: none; border-color: var(--accent); }
.answer .unit { font: 500 18px var(--f-mono); color: var(--muted); }
.btn { font: 600 15px var(--f-ui); background: var(--accent); color: var(--sheet); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.07); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: 13px; color: var(--muted); }
.summary { text-align: center; padding: 26px 0 8px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.big { font: 600 44px var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.weak { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chipbtn { font: 500 13px var(--f-ui); background: var(--warn-soft); color: var(--warn); border: 0; border-radius: 99px; padding: 4px 11px; cursor: pointer; }

.notebook { display: flex; flex-direction: column; gap: 10px; }
.notebook h2 { font: 600 17px var(--f-display); margin: 14px 0 2px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tcard h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tcard p { margin: 0; max-width: 65ch; }
.tcard .when { color: var(--muted); font-size: 14px; }
.tcard .when b { color: var(--text); font-weight: 600; }
.errc { font-size: 12px; color: var(--warn); font-weight: 500; }
.mono { font-family: var(--f-mono); font-size: .95em; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* iPhone */
body { padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
button, select, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.answer input { font-size: 22px; }

<script>
/* ---------- Приёмы ---------- */
const SECTIONS = { mech: "Механика", elec: "Электричество", opt: "Оптика", heat: "Теплота", gen: "Общие приёмы" };
const T = {
  rod:   { s: "mech", name: "Жёсткий стержень и нерастяжимая нить",
           idea: "Проекции скоростей концов жёсткого стержня (или натянутой нити) на направление стержня равны — иначе его длина менялась бы.",
           when: "лестница скользит по стене, кольца на спицах соединены стержнем, лодку тянут за верёвку, нить через блок." },
  accel: { s: "mech", name: "Ускорение при движении по окружности",
           idea: "Полное ускорение = центростремительное aₙ = v²/R (к центру) + касательное aτ (меняет величину скорости). Они перпендикулярны: a = √(aₙ² + aτ²).",
           when: "тело идёт по дуге и при этом разгоняется или тормозит; сила натяжения нити в нижней точке; давление на мост." },
  icr:   { s: "mech", name: "Мгновенный центр скоростей",
           idea: "При качении без проскальзывания точка касания неподвижна, и всё тело в этот момент вращается вокруг неё. Скорость любой точки = ω · (расстояние до точки касания).",
           when: "колесо, катушка, шар катятся без проскальзывания; спрашивают скорость отдельной точки." },
  rel:   { s: "mech", name: "Переход в другую систему отсчёта",
           idea: "Перейди в систему, где одно из тел покоится. Скорости вычитаются как векторы: v_отн = v₁ − v₂. Задача про два движущихся тела становится задачей про одно.",
           when: "встреча, обгон, переправа через реку, дождь за окном поезда, «какое минимальное расстояние между кораблями»." },
  cm:    { s: "mech", name: "Система центра масс и приведённая масса",
           idea: "В системе центра масс суммарный импульс равен нулю. Энергия относительного движения двух тел: μ·v_отн²/2, где μ = m₁m₂/(m₁ + m₂). Только она может уйти в тепло или в пружину.",
           when: "два тела взаимодействуют только друг с другом (пружина, удар, слипание, нить); спрашивают максимальное сжатие, выделившееся тепло, вращение двойной звезды." },
  mom:   { s: "mech", name: "Сохранение импульса вдоль оси",
           idea: "Если вдоль оси нет внешних сил, проекция импульса системы на неё сохраняется — даже если внутри есть трение и энергия теряется. Центр масс при этом движется равномерно или стоит.",
           when: "брусок скользит по доске на гладком льду, человек идёт по лодке, снаряд разрывается, пуля застревает в бруске." },
  fricE: { s: "mech", name: "Энергия и работа трения",
           idea: "Тепло от трения Q = F_тр · s_отн, где s_отн — путь одного тела относительно другого. Механическая энергия уменьшается ровно на Q.",
           when: "спрашивают тормозной путь без времени, выделившееся тепло, длину проскальзывания бруска по доске." },
  fricC: { s: "mech", name: "Проверка: есть ли проскальзывание",
           idea: "Сначала предположи, что тела движутся вместе (или тело покоится), и найди нужную для этого силу трения покоя. Если она ≤ μN — так и есть. Иначе тела скользят, и трение равно μN.",
           when: "брусок на тележке или на другом бруске, тело на наклонной плоскости, «найдите силу трения»." },
  mom2:  { s: "mech", name: "Правило моментов от удобной точки",
           idea: "В равновесии сумма моментов сил равна нулю относительно любой точки. Бери точку, через которую проходят неизвестные силы — они выпадут из уравнения.",
           when: "балка на опорах, лестница у стены, рычаг, стержень на шарнире, «с какой силой давит на опору»." },
  graph: { s: "gen",  name: "Площадь под графиком",
           idea: "Путь = площадь под v(t), работа = площадь под F(x), заряд = площадь под I(t), изменение скорости = площадь под a(t).",
           when: "дан график, величина меняется неравномерно, спрашивают накопленную величину." },
  avg:   { s: "gen",  name: "Средняя скорость",
           idea: "v_ср = весь путь / всё время. Это не среднее арифметическое скоростей — кроме случая, когда равны промежутки времени.",
           when: "участки с разными скоростями: «половину пути…», «половину времени…»." },
  lim:   { s: "gen",  name: "Предельные случаи и размерность",
           idea: "Проверь ответ: правильные ли единицы, что будет при m → 0, при равных массах, при α → 90°, при R → ∞. Это ловит большинство ошибок и помогает выбрать вариант без решения.",
           when: "получил формулу и сомневаешься; нужно выбрать верный вариант из нескольких; задача-оценка." },
  thev:  { s: "elec", name: "Эквивалентный генератор",
           idea: "Любую цепь из батарей и резисторов относительно двух клемм можно заменить одной ЭДС E₀ (напряжение на разомкнутых клеммах) и сопротивлением r₀ (сопротивление между клеммами при закороченных источниках). Для нелинейного элемента ток — пересечение прямой U = E₀ − I·r₀ с его ВАХ.",
           when: "в цепи лампа или диод с графиком ВАХ; меняется только один резистор; «при каком R мощность максимальна»." },
  sym:   { s: "elec", name: "Симметрия: точки равного потенциала",
           idea: "Точки с одинаковым потенциалом можно соединить проводом или разъединить — токи не изменятся. Такие точки ищи по симметрии схемы.",
           when: "куб, тетраэдр, сетка, звезда из одинаковых резисторов." },
  chain: { s: "elec", name: "Бесконечная цепочка",
           idea: "Если цепочка бесконечна, то после отрезания первого звена остаётся такая же цепочка. Получается уравнение на её сопротивление (или ёмкость).",
           when: "бесконечная лестница из резисторов или конденсаторов, «и так далее до бесконечности»." },
  meter: { s: "elec", name: "Идеальные приборы",
           idea: "Идеальный вольтметр — разрыв цепи (ток через него 0), идеальный амперметр — провод (напряжение на нём 0). Сначала перерисуй схему с этой заменой.",
           when: "много вольтметров и амперметров, «приборы идеальные», вольтметр включили последовательно." },
  unfold:{ s: "opt",  name: "Разворачивание зеркал",
           idea: "Вместо того чтобы ломать луч, отрази «мир»: после зеркала луч идёт прямо в зеркальной копии пространства. Ломаная становится прямой — легко найти кратчайший путь, число отражений, число изображений.",
           when: "много отражений между зеркалами, кратчайший путь «через берег» или «через стену», угол между зеркалами, число изображений." },
  mirror:{ s: "opt",  name: "Изображение в плоском зеркале",
           idea: "Изображение симметрично предмету относительно плоскости зеркала. Глаз видит точку, если прямая «глаз — изображение точки» проходит через зеркало.",
           when: "какого размера нужно зеркало, увидит ли человек предмет, поле зрения." },
  lens:  { s: "opt",  name: "Формула тонкой линзы",
           idea: "1/d + 1/f = 1/F (для мнимого изображения f < 0, для рассеивающей линзы F < 0). Увеличение Γ = f/d.",
           when: "линза, расстояния до предмета, изображения, экрана; увеличение." },
  heat:  { s: "heat", name: "Тепловой баланс с проверкой этапов",
           idea: "Не пиши сразу одно уравнение. Посчитай тепло на каждый этап (нагреть лёд до 0 °C, расплавить, нагреть воду) и сколько может отдать горячее тело до 0 °C. Сравни — и узнаешь, чем всё закончится.",
           when: "лёд + вода, пар + вода, «найдите конечную температуру» при фазовых переходах." }
};
const RELATED = [["rod","icr"],["icr","accel"],["cm","mom"],["cm","fricE"],["cm","rel"],["mom","fricE"],["fricE","fricC"],
  ["thev","meter"],["sym","chain"],["unfold","mirror"],["graph","avg"]];
const rel = (a, b) => RELATED.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

/* ---------- «Какой приём?»: условие + подсказка, которая указывает на главное в условии ---------- */

/* ---------- Хранилище ---------- */
const KEY = "olymp-phys-trainer-v1";
let S = { q: {}, p: {}, n: 0, ok: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function st(kind, id) { return S[kind][id] || (S[kind][id] = { ok: 0, bad: 0 }); }
function techErrors() {
  const m = {};
  Q.forEach(q => { const s = S.q[q.id]; if (s && s.bad) m[q.t] = (m[q.t] || 0) + s.bad; });
  P.forEach(p => { const s = S.p[p.id]; if (s && s.bad) m[p.t] = (m[p.t] || 0) + s.bad; });
  return m;
}

/* ---------- Утилиты ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function renderStats() {
  const pct = S.n ? Math.round(S.ok / S.n * 100) : 0;
  const solved = P.filter(p => S.p[p.id] && S.p[p.id].ok).length;
  $("#stats").innerHTML = `<span>ответов: <b>${S.n}</b></span><span>верно: <b>${pct}%</b></span><span>задач решено: <b>${solved}/${P.length}</b></span>`;
}
function techOptions(sel) {
  return Object.entries(SECTIONS).map(([s, name]) =>
    `<optgroup label="${name}">${Object.entries(T).filter(([, t]) => t.s === s).map(([id, t]) =>
      `<option value="${id}"${sel === id ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</optgroup>`).join("");
}
function weakHTML() {
  const e = Object.entries(techErrors()).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (!e.length) return "";
  return `<div class="weak"><span class="small">Чаще всего ошибаешься:</span>${e.map(([id, n]) =>
    `<button class="chipbtn" data-drill="${id}">${esc(T[id].name)} · ${n}</button>`).join("")}</div>`;
}
function ideaBox(id, cls, label) {
  return `<div class="box ${cls}"><span class="k">${label}</span><h3>${esc(T[id].name)}</h3><p>${esc(T[id].idea)}</p></div>`;
}

/* ---------- Вкладки ---------- */
const tabs = document.querySelectorAll(".tab");
function showTab(name) {
  tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false"));
  ["quiz", "tasks", "book"].forEach(n => $("#p-" + n).hidden = n !== name);
  if (name === "book") renderBook();
  try { localStorage.setItem(KEY + "-tab", name); } catch (e) {}
}
tabs.forEach(t => t.onclick = () => showTab(t.dataset.tab));

/* ---------- «Какой приём?» ---------- */
const QZ = { filter: "", queue: [], cur: null, choices: [], wrong: new Set(), done: false, seen: new Set(), first: { n: 0, ok: 0 }, total: 0 };
function pickChoices(q) {
  const others = Object.keys(T).filter(id => id !== q.t && !rel(id, q.t));
  const same = shuffle(others.filter(id => T[id].s === T[q.t].s));
  const rest = shuffle(others.filter(id => T[id].s !== T[q.t].s));
  return shuffle([q.t, ...same.concat(rest).slice(0, 3)]);
}
function quizStart() {
  const pool = Q.filter(q => !QZ.filter || q.t === QZ.filter);
  QZ.queue = shuffle(pool).slice(0, 15).map(q => q.id);
  QZ.total = QZ.queue.length; QZ.seen = new Set(); QZ.first = { n: 0, ok: 0 }; QZ.missed = {};
  quizNext();
}
function quizNext() {
  QZ.cur = QZ.queue.shift() || null; QZ.wrong = new Set(); QZ.done = false;
  if (QZ.cur) QZ.choices = pickChoices(Q.find(q => q.id === QZ.cur));
  renderQuiz();
}
function quizAnswer(id) {
  const q = Q.find(x => x.id === QZ.cur); if (QZ.done || QZ.wrong.has(id)) return;
  const first = !QZ.seen.has(q.id) && QZ.wrong.size === 0;
  const s = st("q", q.id); S.n++;
  if (id === q.t) {
    S.ok++; s.ok++; QZ.done = true;
    if (first) { QZ.first.n++; QZ.first.ok++; }
  } else {
    s.bad++; QZ.wrong.add(id); QZ.missed[q.t] = 1;
    if (first) { QZ.first.n++; QZ.queue.splice(Math.min(QZ.queue.length, 4), 0, q.id); }
  }
  QZ.seen.add(q.id); save(); renderStats(); renderQuiz();
}
function renderQuiz() {
  const root = $("#p-quiz");
  const controls = `<div class="controls"><label class="lbl">Приём
      <select id="qz-filter"><option value="">все вперемешку</option>${techOptions(QZ.filter)}</select></label></div>`;
  let body;
  if (!QZ.cur) {
    const pct = QZ.first.n ? Math.round(QZ.first.ok / QZ.first.n * 100) : 0;
    const missed = Object.keys(QZ.missed || {});
    body = `<div class="summary"><div class="big">${QZ.first.ok} / ${QZ.first.n}</div><div>угадано с первой попытки (${pct}%)</div>
      ${missed.length ? `<div class="small">Перечитай эти приёмы:</div><div class="row" style="justify-content:center">${missed.map(id => `<button class="chipbtn" data-drill="${id}">${esc(T[id].name)}</button>`).join("")}</div>` : ""}
      <button class="btn" id="qz-again">Ещё 15 вопросов</button></div>`;
  } else {
    const q = Q.find(x => x.id === QZ.cur);
    const last = [...QZ.wrong].pop();
    body = `<div class="progress"><i style="width:${(QZ.first.n) / Math.max(1, QZ.total) * 100}%"></i></div>
      <div class="ptext">осталось ${QZ.queue.length + 1} <span class="pill">${SECTIONS[T[q.t].s]}</span>${QZ.seen.has(q.id) && !QZ.wrong.size && !QZ.done ? `<span class="pill warn">повтор</span>` : ""}</div>
      <div class="problem">${esc(q.text)}</div>
      <div class="q-label" style="margin-bottom:8px">С какого приёма начать?</div>
      <div class="choices">${QZ.choices.map(id => {
        const cls = QZ.done && id === q.t ? " good" : QZ.wrong.has(id) ? " bad" : "";
        return `<button class="choice${cls}" data-c="${id}"${QZ.done || QZ.wrong.has(id) ? " disabled" : ""}>${esc(T[id].name)}</button>`; }).join("")}</div>
      <div class="fb">
        ${QZ.done ? `${ideaBox(q.t, "ok", "Верно")}<div class="row"><button class="btn" id="qz-next">Дальше</button></div>` : ""}
        ${!QZ.done && last ? `<div class="box warn"><span class="k">Не этот. Подсказка</span><p>${esc(q.hint)}</p>
            <p class="small">«${esc(T[last].name)}» нужен, когда: ${esc(T[last].when)}</p></div>
            <div class="small">Выбери ещё раз. Этот вопрос потом повторится.</div>` : ""}
      </div>`;
  }
  root.innerHTML = controls + body + weakHTML();
  $("#qz-filter", root).onchange = e => { QZ.filter = e.target.value; quizStart(); };
  root.querySelectorAll("[data-c]").forEach(b => b.onclick = () => quizAnswer(b.dataset.c));
  const n = $("#qz-next", root); if (n) { n.onclick = quizNext; n.focus({ preventScroll: true }); }
  const a = $("#qz-again", root); if (a) a.onclick = quizStart;
  root.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => drill(b.dataset.drill));
}

/* ---------- «Задачи» ---------- */
const TK = { filter: "", queue: [], cur: null, tries: 0, solved: false, hintShown: 0, msg: "", total: 0, first: { n: 0, ok: 0 }, seen: new Set() };
function tasksStart() {
  const pool = P.filter(p => !TK.filter || p.t === TK.filter);
  TK.queue = shuffle(pool).map(p => p.id); TK.total = TK.queue.length;
  TK.first = { n: 0, ok: 0 }; TK.seen = new Set(); tasksNext();
}
function tasksNext() { TK.cur = TK.queue.shift() || null; TK.tries = 0; TK.solved = false; TK.hintShown = 0; TK.msg = ""; renderTasks(); }
function parseNum(s) { s = String(s).trim().replace(",", ".").replace(/\s/g, ""); return s === "" ? NaN : Number(s); }
function tasksCheck() {
  const p = P.find(x => x.id === TK.cur); const v = parseNum($("#tk-in").value);
  if (Number.isNaN(v)) { TK.msg = "Введи число, например 2,5"; renderTasks(); return; }
  const ok = Math.abs(v - p.ans) <= Math.max(Math.abs(p.ans) * 0.02, 1e-9);
  const s = st("p", p.id); S.n++;
  const first = !TK.seen.has(p.id) && TK.tries === 0;
  if (first) TK.first.n++;
  TK.tries++;
  if (ok) { S.ok++; s.ok++; TK.solved = true; TK.msg = ""; if (first) TK.first.ok++; }
  else {
    s.bad++; TK.hintShown = Math.min(2, Math.max(TK.hintShown, TK.tries));
    TK.msg = TK.tries === 1 ? "Не сходится. Вот подсказка." : "Всё ещё не сходится. Вот следующая подсказка — проверь вычисления и единицы.";
  }
  TK.seen.add(p.id); save(); renderStats(); renderTasks();
}
function tasksSkip() { TK.queue.splice(Math.min(TK.queue.length, 3), 0, TK.cur); TK.seen.add(TK.cur); tasksNext(); }
function renderTasks() {
  const root = $("#p-tasks");
  const controls = `<div class="controls"><label class="lbl">Приём
      <select id="tk-filter"><option value="">все задачи</option>${techOptions(TK.filter)}</select></label>
      <span class="small">g = 10 м/с². Ответ засчитывается с точностью 2%.</span></div>`;
  let body;
  if (!TK.cur) {
    body = `<div class="summary"><div class="big">${TK.first.ok} / ${TK.first.n}</div><div>решено с первой попытки</div>
      <button class="btn" id="tk-again">Ещё раз</button></div>`;
  } else {
    const p = P.find(x => x.id === TK.cur);
    body = `<div class="progress"><i style="width:${(TK.total - TK.queue.length - 1) / Math.max(1, TK.total) * 100}%"></i></div>
      <div class="ptext">осталось ${TK.queue.length + 1} <span class="pill">${SECTIONS[T[p.t].s]}</span>${TK.seen.has(p.id) && !TK.tries ? `<span class="pill warn">повтор</span>` : ""}</div>
      <div class="problem">${esc(p.text)}</div>
      <form class="answer" id="tk-form" autocomplete="off">
        <input id="tk-in" inputmode="decimal" enterkeyhint="done" aria-label="Ответ"${TK.solved ? " disabled" : ""}>
        <span class="unit">${esc(p.unit)}</span>
        ${TK.solved ? "" : `<button class="btn" type="submit">Проверить</button>
          ${TK.hintShown < 2 ? `<button class="btn ghost" type="button" id="tk-hint">Подсказка</button>` : ""}
          <button class="btn ghost" type="button" id="tk-skip">Отложить</button>`}
      </form>
      <div class="fb">
        ${TK.msg ? `<div class="small" style="color:var(--warn)">${esc(TK.msg)}</div>` : ""}
        ${!TK.solved && TK.hintShown >= 1 ? `<div class="box warn"><span class="k">Подсказка 1 · ${esc(T[p.t].name)}</span><p>${esc(p.h[0])}</p></div>` : ""}
        ${!TK.solved && TK.hintShown >= 2 ? `<div class="box warn"><span class="k">Подсказка 2 · ключевое уравнение</span><p class="mono">${esc(p.h[1])}</p></div>` : ""}
        ${TK.solved ? `${ideaBox(p.t, "ok", TK.tries === 1 ? "Верно с первой попытки" : `Верно · попыток: ${TK.tries}`)}<div class="row"><button class="btn" id="tk-next">Следующая задача</button></div>` : ""}
      </div>`;
  }
  root.innerHTML = controls + body + weakHTML();
  $("#tk-filter", root).onchange = e => { TK.filter = e.target.value; tasksStart(); };
  const f = $("#tk-form", root);
  if (f) f.onsubmit = e => { e.preventDefault(); if (!TK.solved) tasksCheck(); };
  const h = $("#tk-hint", root); if (h) h.onclick = () => { TK.hintShown++; TK.msg = ""; renderTasks(); };
  const sk = $("#tk-skip", root); if (sk) sk.onclick = tasksSkip;
  const n = $("#tk-next", root); if (n) { n.onclick = tasksNext; n.focus({ preventScroll: true }); }
  const a = $("#tk-again", root); if (a) a.onclick = tasksStart;
  root.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => drill(b.dataset.drill));
}

/* ---------- «Все приёмы» ---------- */
function renderBook() {
  const errs = techErrors();
  const root = $("#p-book");
  root.innerHTML = `<div class="notebook">${Object.entries(SECTIONS).map(([s, name]) => `<h2>${name}</h2>` +
    Object.entries(T).filter(([, t]) => t.s === s).map(([id, t]) => {
      const nq = Q.filter(q => q.t === id).length, np = P.filter(p => p.t === id).length;
      return `<div class="tcard"><h3>${esc(t.name)}${errs[id] ? `<span class="errc">ошибок: ${errs[id]}</span>` : ""}</h3>
        <p>${esc(t.idea)}</p><p class="when"><b>Узнать по условию:</b> ${esc(t.when)}</p>
        <div class="row">${nq ? `<button class="btn ghost" data-dq="${id}">Вопросы · ${nq}</button>` : ""}${np ? `<button class="btn ghost" data-dp="${id}">Задачи · ${np}</button>` : ""}</div></div>`;
    }).join("")).join("")}</div>`;
  root.querySelectorAll("[data-dq]").forEach(b => b.onclick = () => { QZ.filter = b.dataset.dq; showTab("quiz"); quizStart(); });
  root.querySelectorAll("[data-dp]").forEach(b => b.onclick = () => { TK.filter = b.dataset.dp; showTab("tasks"); tasksStart(); });
}
function drill(id) {
  if (P.some(p => p.t === id)) { TK.filter = id; showTab("tasks"); tasksStart(); }
  else { QZ.filter = id; showTab("quiz"); quizStart(); }
}

/* ---------- Старт ---------- */
renderStats(); quizStart(); tasksStart();
let startTab = "quiz";
try { startTab = localStorage.getItem(KEY + "-tab") || "quiz"; } catch (e) {}
showTab(["quiz", "tasks", "book"].includes(startTab) ? startTab : "quiz");
