.appnav::-webkit-scrollbar { display: none; }
.appnav a { font: 500 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; color: inherit; text-decoration: none; white-space: nowrap; padding: 5px 11px; border-radius: 99px; border: 1px solid rgba(127,127,127,.35); opacity: .75; }

<body>

<style>
/* Layout: one notebook sheet on graph paper; teacher's marks live in the red right margin */
:root {
  --paper: #f3f6fb;
  --grid: #dde6f2;
  --sheet: #ffffff;
  --text: #1c2333;
  --muted: #5f6a82;
  --line: #d3dbe8;
  --ink: #2443b0;
  --ink-soft: #e7ecfb;
  --red: #cf3329;
  --red-soft: #fbe9e7;
  --ok: #24784a;
  --ok-soft: #e4f3ea;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-word: "PT Serif", "Times New Roman", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --grid: #19202c; --sheet: #171c26; --text: #e5e9f1; --muted: #9aa4b9;
    --line: #2b3444; --ink: #92a9ff; --ink-soft: #222c47; --red: #ff6f62; --red-soft: #3a1f1d;
    --ok: #63d394; --ok-soft: #173126; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --grid: #19202c; --sheet: #171c26; --text: #e5e9f1; --muted: #9aa4b9;
  --line: #2b3444; --ink: #92a9ff; --ink-soft: #222c47; --red: #ff6f62; --red-soft: #3a1f1d;
  --ok: #63d394; --ok-soft: #173126; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--f-word); font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { font-family: var(--f-hand); font-size: 22px; color: var(--ink); line-height: 1; }
.stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.stats b { color: var(--text); font-weight: 600; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  font: 500 15px var(--f-ui); color: var(--muted); background: transparent; border: 1px solid transparent;
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); border-color: var(--line); }

.sheet {
  position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px;
  padding: 22px 76px 26px 24px; min-width: 0;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 30, 60, .35);
}
.sheet::after { content: ""; position: absolute; top: 0; bottom: 0; right: 56px; width: 1.5px; background: var(--red); opacity: .55; }
.mark {
  position: absolute; right: 8px; width: 40px; text-align: center; font-family: var(--f-hand); font-weight: 700;
  font-size: 40px; line-height: 1; color: var(--red); pointer-events: none;
}
@media (max-width: 560px) {
  .sheet { padding: 18px 50px 22px 16px; }
  .sheet::after { right: 38px; }
  .mark { right: 2px; width: 34px; font-size: 34px; }
}

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 14px var(--f-ui); background: transparent; color: var(--muted); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink-soft); color: var(--ink); }
select { font: 14px var(--f-ui); color: var(--text); background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
label.lbl { font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.progress i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.ptext { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.word { font-family: var(--f-word); font-size: clamp(30px, 7vw, 46px); line-height: 1.25; text-align: center; padding: 34px 0 10px; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: .55em; }
.gap {
  display: inline-block; min-width: .75em; text-align: center; color: var(--ink);
  border-bottom: 2px dashed var(--ink); line-height: 1; padding: 0 .05em; font-family: var(--f-hand); font-weight: 700;
}
.gap.filled { border-bottom-style: solid; font-size: 1.15em; }
.gap.filled.bad { color: var(--red); border-color: var(--red); }
.opts { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 8px; }
.opt {
  min-width: 68px; height: 64px; font: 700 34px var(--f-hand); color: var(--ink); background: var(--sheet);
  border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; padding: 0 14px;
}
.opt:hover:not(:disabled) { border-color: var(--ink); background: var(--ink-soft); }
.opt:disabled { cursor: default; opacity: .45; }
.opt .k { display: block; font: 11px var(--f-ui); color: var(--muted); margin-top: -6px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); }

.fb { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.fb .head { font-family: var(--f-hand); font-size: 28px; line-height: 1; }
.fb.ok .head { color: var(--ok); }
.fb.bad .head { color: var(--red); }
.rule { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px 16px; background: var(--sheet); }
.rule h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.rule p { margin: 0; color: var(--text); max-width: 65ch; }
.rule p + p { margin-top: 6px; }
.fb.bad .rule { border-color: var(--red); background: var(--red-soft); }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  font: 600 15px var(--f-ui); background: var(--ink); color: var(--sheet); border: 0; border-radius: 8px;
  padding: 10px 18px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.08); }
.small { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--ink-soft); color: var(--ink); white-space: nowrap; }

.weak { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.weak .t { font-size: 13px; color: var(--muted); margin-right: 4px; }
.chipbtn { font: 500 13px var(--f-ui); background: var(--red-soft); color: var(--red); border: 0; border-radius: 99px; padding: 4px 11px; cursor: pointer; }

.summary { text-align: center; padding: 26px 0 8px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.big { font-family: var(--f-hand); font-size: 56px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Rows (EGE format) */
.task { font-family: var(--f-word); font-size: 16px; margin: 0 0 14px; max-width: 65ch; }
.rows { display: flex; flex-direction: column; gap: 4px; }
.r {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left;
  background: transparent; border: 1.5px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer;
  font: 18px var(--f-word); color: var(--text); width: 100%;
}
.r:hover { background: var(--ink-soft); }
.r .n {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center;
  font: 600 14px var(--f-ui); color: var(--muted);
}
.r[aria-pressed="true"] .n { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.r[aria-pressed="true"] { border-color: var(--ink-soft); }
.r .ws { display: flex; flex-wrap: wrap; gap: 4px 0; min-width: 0; }
.w { display: inline-flex; flex-direction: column; align-items: flex-start; margin-right: .45em; }
.chip {
  font: 500 11.5px var(--f-ui); color: var(--red); background: var(--red-soft); border-radius: 99px; padding: 1px 8px;
  margin-top: 3px; border: 0; cursor: pointer; white-space: nowrap;
}
.answer-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-top: 14px; }
.answer-line .hand { font: 700 30px var(--f-hand); color: var(--ink); min-width: 80px; border-bottom: 1.5px solid var(--text); padding: 0 6px; letter-spacing: .12em; }
.msg { margin-top: 12px; }
.msg.bad { color: var(--red); }
.msg.ok { color: var(--ok); }

.blocks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.bk { font: 600 13px var(--f-ui); border: 1px solid var(--line); background: var(--sheet); color: var(--muted); border-radius: 7px; padding: 5px 9px; cursor: pointer; font-variant-numeric: tabular-nums; }
.bk.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.bk[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.orig { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.orig .hand { font: 700 24px var(--f-hand); color: var(--ink); }
.orig .redm { font: 700 24px var(--f-hand); color: var(--red); }

.rules-list { display: grid; gap: 12px; }
.rules-list h2 { font: 700 20px var(--f-word); margin: 12px 0 0; }
.rcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.rcard h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rcard p { margin: 0; max-width: 65ch; }
.rcard .row-actions { margin-top: 2px; }
.errc { font-size: 12px; color: var(--red); font-weight: 500; }


.sent { font: 21px/2 var(--f-word); text-align: center; padding: 24px 0 8px; }
.sent .sw { border-radius: 5px; padding: 2px 1px; }
.sent .sw[data-sw] { cursor: pointer; }
.sent .sw[data-sw]:hover, .sent .sw.sel { background: var(--ink-soft); }
.cm { font-family: var(--f-hand); font-weight: 700; font-size: 1.35em; line-height: 0; color: var(--ink); }
.cm.ok { color: var(--ok); }
.cm.miss { color: var(--red); text-decoration: underline; }
.cm.extra { color: var(--red); text-decoration: line-through; }
.r .ws .sw { font: 17px/1.6 var(--f-word); }
.cnt16 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 13px var(--f-ui); color: var(--muted); margin-top: 4px; }
.cnt16 .chip { margin-top: 0; }
.opt.ropt { font: 600 15px var(--f-ui); height: auto; min-height: 54px; padding: 8px 14px; max-width: 100%; }
.opt.ropt .k { margin-top: 2px; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* iPhone */
body { padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
button, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (hover: none) { .hint, .opt .k { display: none; } .opt { min-width: 76px; height: 70px; } .r:hover { background: transparent; } .r[aria-pressed="true"] { background: var(--ink-soft); } }
</style>

<div class="wrap">
  <nav class="appnav" aria-label="Тренажёры"><a class="home" href="../" aria-label="Все тренажёры">☰</a><a href="../russian/" aria-current="page">Русский</a><a href="../physics/">Физика</a><a href="../german/">Немецкий</a><a href="../english/">Английский</a></nav>

    <div>
      <h1>Русский ЕГЭ</h1>
      <div class="sub">задания 9, 10 и 16 · работа над ошибками</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="words" aria-selected="true">Слова</button>
    <button class="tab" role="tab" data-tab="rows" aria-selected="false">Ряды как на ЕГЭ</button>
    <button class="tab" role="tab" data-tab="test" aria-selected="false">Моя ср</button>
    <button class="tab" role="tab" data-tab="commas" aria-selected="false">Запятые · 16</button>
    <button class="tab" role="tab" data-tab="rules" aria-selected="false">Правила</button>
  </nav>

  <section class="sheet" id="p-words"></section>
  <section class="sheet" id="p-rows" hidden></section>

<script>
/* ---------- Правила ---------- */
const RULES = {
  prov:   { t: 9,  short: "проверяемая", title: "Проверяемая безударная гласная",
            text: ["Поставь гласную под ударение: измени форму слова или подбери однокоренное слово с тем же значением.",
                   "Следи за смыслом: поласкать (кота) проверяется словом «ласка», а полоскать (бельё) — словом «полощет»; посидеть (у окна) — «сидя», поседеть (о волосах) — «седой»."] },
  neprov: { t: 9,  short: "словарное", title: "Непроверяемая (словарная) гласная",
            text: ["Ударением эту гласную не проверить — написание нужно запомнить. Часто это заимствованные слова.",
                   "Не пытайся подобрать «проверочное» слово по звучанию — так делают типичную ошибку. Вспомни, как слово выглядит в словаре, и выпиши его в свой список."] },
  lag:    { t: 9,  short: "-лаг-/-лож-", title: "Корни -лаг- / -лож-",
            text: ["Перед г пишется а, перед ж — о. Ударение здесь ничего не решает.", "Исключение: полог."] },
  kas:    { t: 9,  short: "-кас-/-кос-", title: "Корни -кас- / -кос-",
            text: ["Если сразу после корня стоит суффикс -а-, пишется а. Если суффикса -а- нет — о."] },
  rast:   { t: 9,  short: "-раст-/-рос-", title: "Корни -раст- / -ращ- / -рос-",
            text: ["Перед ст и щ пишется а, перед с (без т) — о.",
                   "Исключения: росток, ростовщик, отрасль, Ростов, Ростислав, подросток — и однокоренные к ним."] },
  skak:   { t: 9,  short: "-скак-/-скоч-", title: "Корни -скак- / -скоч-",
            text: ["Перед к пишется а, перед ч — о.", "Исключения: скачок, скачу."] },
  gar:    { t: 9,  short: "-гар-/-гор-", title: "Корни -гар- / -гор-",
            text: ["Без ударения пишется о. Под ударением — как слышится.", "Исключения: выгарки, изгарь, пригарь."] },
  zar:    { t: 9,  short: "-зар-/-зор-", title: "Корни -зар- / -зор-",
            text: ["Без ударения пишется а. Под ударением — как слышится.", "Исключение: зоревать."] },
  tvar:   { t: 9,  short: "-твар-/-твор-", title: "Корни -твар- / -твор-",
            text: ["Без ударения пишется о.", "Исключение: утварь."] },
  plav:   { t: 9,  short: "-плав-/-плов-", title: "Корни -плав- / -плов-",
            text: ["Пишется а.", "Исключения: пловец, пловчиха, плывун."] },
  ravn:   { t: 9,  short: "-равн-/-ровн-", title: "Корни -равн- / -ровн-",
            text: ["-равн- — значение «равный, одинаковый, наравне»; -ровн- — «ровный, гладкий, прямой».",
                   "Исключения: ровесник, ровня, уровень, равнина."] },
  mak:    { t: 9,  short: "-мак-/-мок-", title: "Корни -мак- / -мок-",
            text: ["-мак- — значение «окунать в жидкость»; -мок- — «пропускать жидкость, становиться мокрым»."] },
  klan:   { t: 9,  short: "-клан-/-клон-", title: "Корни -клан- / -клон-",
            text: ["Без ударения пишется о. Под ударением — как слышится."] },
  ei:     { t: 9,  short: "е/и + суффикс -а-", title: "Корни с чередованием е / и",
            text: ["-бер-/-бир-, -дер-/-дир-, -мер-/-мир-, -пер-/-пир-, -тер-/-тир-, -блест-/-блист-, -жег-/-жиг-, -стел-/-стил-, -чет-/-чит-.",
                   "Если сразу после корня стоит суффикс -а-, пишется и. Если суффикса -а- нет — е. Исключения: сочетать, сочетание, чета.",
                   "Не путай с проверяемыми корнями: «мир» (покой) и «мер» (мера) проверяются ударением."] },
  im:     { t: 9,  short: "-им-/-а-", title: "Корни с чередованием -им- / -а- (-ин- / -я-)",
            text: ["Если после корня есть суффикс -а-, пишется -им- / -ин-: сжать — сжимать, начать — начинать."] },
  c:      { t: 9,  short: "и/ы после ц", title: "И / Ы после Ц", opts: ["и", "ы"],
            text: ["В корне после ц пишется и. Исключения: цыган, цыплёнок, на цыпочках, цыц — и однокоренные.",
                   "В окончаниях и суффиксах -ын пишется ы (огурцы, сестрицын)."] },
  sh:     { t: 9,  short: "ё/о после шипящих", title: "Ё / О после шипящих в корне", opts: ["ё", "о"],
            text: ["Под ударением пишется ё, если можно подобрать однокоренное слово с е (жёлтый — желтеть).",
                   "Если такого слова нет — пишется о (шорох, обжора). В заимствованных словах тоже о (шок, шорты, жокей)."] },

  pre:    { t: 10, short: "пре-/при-", title: "Приставки ПРЕ- и ПРИ-",
            text: ["ПРЕ- = «очень» (премилый) или близко к ПЕРЕ- (преградить = перегородить, преступить = переступить).",
                   "ПРИ- = приближение (прибежать), присоединение (пришить), близость (приморский), неполнота действия (приоткрыть), доведение до результата (пристыдить).",
                   "Определи значение приставки в этом слове — подставь «очень» или «пере-»."] },

  else if (fromTest) BANK[text].fromTest = true;
  return BANK[text];
}

function poolWords() {
  if (W.customIds) return W.customIds.map(id => BANK[id]);
  return ALL.filter(w => {
    if (W.task !== "all" && String(w.task) !== W.task) return false;
    if (W.rule && w.rule !== W.rule) return false;
    if (W.source === "test" && !w.fromTest) return false;
    if (W.source === "mistakes") { const st = S.words[w.id]; if (!st || !st.bad || st.streak >= 2) return false; }
    return true;
  });
}
function startRound() {
  clearTimeout(W.timer);
  const pool = shuffle(poolWords());
  W.queue = pool.slice(0, W.customIds ? pool.length : ROUND).map(w => w.id);
  W.total = W.queue.length; W.seen = new Set(); W.first = { n: 0, ok: 0 }; W.missedRules = {};
  W.current = null; nextWord();
}
function nextWord() {
  clearTimeout(W.timer);
  W.current = W.queue.shift() || null; W.answered = false;
  if (W.current) {
    const w = BANK[W.current];
    const others = shuffle(Object.keys(RULES).filter(id => RULES[id].t === w.task && id !== w.rule));
    W.ropts = shuffle([w.rule, ...others.slice(0, 3)]);
  }
  renderWords();
}
function answer(letter) {
  if (!W.current || W.answered) return;
  const w = BANK[W.current]; const ok = W.mode === "rule" ? letter === w.rule : letter === w.ans; const st = ws(w.id);
  W.answered = { letter, ok };
  const firstTime = !W.seen.has(w.id); W.seen.add(w.id);
  if (firstTime) { W.first.n++; if (ok) W.first.ok++; }
  S.total.n++;
  if (ok) { S.total.ok++; st.ok++; st.streak++; }
  else {
    st.bad++; st.streak = 0; W.missedRules[w.rule] = (W.missedRules[w.rule] || 0) + 1;
    const pos = Math.min(W.queue.length, 3 + Math.floor(Math.random() * 3));
    W.queue.splice(pos, 0, w.id);
  }
  save(); renderStats(); renderWords();
  if (ok) W.timer = setTimeout(nextWord, 1300);
}

/* ---------- Режим «Ряды как на ЕГЭ» ---------- */
function genBlock(task) {
  const pool = ALL.filter(w => w.task === task);
  for (let tries = 0; tries < 300; tries++) {
    const used = new Set(); const rows = []; let ok = true;
    const k = 2 + Math.floor(Math.random() * 3);
    const pattern = shuffle([0, 1, 2, 3, 4].map(i => i < k));
    for (const yes of pattern) {
      const avail = pool.filter(w => !used.has(w.id));
      const groups = {};
      avail.forEach(w => { const key = optsOf(w).join() + "|" + w.ans; (groups[key] = groups[key] || []).push(w); });
      const need = yes ? 3 : 2;
      const cand = Object.values(groups).filter(g => g.length >= need);
      if (!cand.length) { ok = false; break; }
      const g = pick(cand); const chosen = shuffle(g).slice(0, need);
      if (!yes) {
        const fam = optsOf(chosen[0]).join();
        const odd = avail.filter(w => optsOf(w).join() === fam && w.ans !== chosen[0].ans);
        if (!odd.length) { ok = false; break; }
        chosen.push(pick(odd));
      }
      chosen.forEach(w => used.add(w.id));
      rows.push(shuffle(chosen).map(w => w.id));
    }
    if (ok) return { task, rows };
  }
  return null;
}

function sentHTML(s, mode, sel) {
  return s.words.map((w, j) => {
    const need = s.commas.includes(j), mine = sel && sel.has(j), last = j === s.words.length - 1;
    if (mode === "pick") return `<span class="sw${mine ? " sel" : ""}"${last ? "" : ` data-sw="${j}"`}>${esc(w)}${mine ? '<b class="cm">,</b>' : ""}</span>`;
    if (mode === "check") {

    if (mode === "show") return `<span class="sw">${esc(w)}${need ? '<b class="cm ok">,</b>' : ""}</span>`;

const C = { mode: "place", rule: "", source: "all", queue: [], cur: null, sel: new Set(), res: null, first: { n: 0, ok: 0 }, total: 0, seen: new Set(), ege: null };
const CROUND = 12;
function poolSent() {
  return SENT.filter(s => {
    if (C.rule && s.rule !== C.rule) return false;
    if (C.source === "mistakes") { const st = (S.sent || {})[s.id]; if (!st || !st.bad || st.streak >= 2) return false; }
    return true;
  });
}
function startCommas() {

  C.total = C.queue.length; C.first = { n: 0, ok: 0 }; C.seen = new Set();

}
function nextSent() { C.cur = C.queue.shift() || null; C.sel = new Set(); C.res = null; renderCommas(); }
function recordSent(s, ok) {
  const st = sst(s.id);
  const firstTime = !C.seen.has(s.id); C.seen.add(s.id);
  if (firstTime) { C.first.n++; if (ok) C.first.ok++; }
  S.total.n++;
  if (ok) { S.total.ok++; st.ok++; st.streak++; }
  else { st.bad++; st.streak = 0; C.queue.splice(Math.min(C.queue.length, 3), 0, s.id); }

}
function genEge() {
  const pool = poolSent().length >= 8 ? poolSent() : SENT;
  const one = shuffle(pool.filter(s => s.commas.length === 1)).slice(0, 2);
  const other = shuffle(pool.filter(s => s.commas.length !== 1)).slice(0, 3);
  if (one.length < 2 || other.length < 3) {
    return { list: shuffle(shuffle(SENT.filter(s => s.commas.length === 1)).slice(0, 2).concat(shuffle(SENT.filter(s => s.commas.length !== 1)).slice(0, 3))).map(s => s.id), sel: new Set(), done: false };

}

    }
    const fb = r ? (r.ok
      ? `<div class="fb ok"><div class="head">Верно</div><p style="margin:0">${esc(s.note)}</p><div class="row-actions"><span class="pill">${esc(RULES[s.rule].short)}</span><button class="btn ghost" id="c-next">Дальше</button></div></div>`
      : `<div class="fb bad"><div class="head">Не так</div><p style="margin:0">${esc(s.note)}</p>${ruleHTML(s.rule)}<div class="row-actions"><button class="btn" id="c-next">Дальше</button><span class="small">Это предложение вернётся через несколько заданий.</span></div></div>`) : "";
    body = head + main + fb + (r ? `<div class="mark" style="top:96px">${r.ok ? "+" : "−"}</div>` : "");
  }
  root.innerHTML = commasControls() + body + weak16HTML();
  root.querySelectorAll("[data-cm]").forEach(b => b.onclick = () => { C.mode = b.dataset.cm; C.cur = null; C.queue = []; C.total = 0; C.ege = null; renderCommas(); });
  $("#c-rule", root).onchange = e => { C.rule = e.target.value; C.cur = null; C.queue = []; C.total = 0; C.ege = null; renderCommas(); };
  $("#c-source", root).onchange = e => { C.source = e.target.value; C.cur = null; C.queue = []; C.total = 0; C.ege = null; renderCommas(); };
  root.querySelectorAll("[data-sw]").forEach(el => el.onclick = () => { const j = +el.dataset.sw; C.sel.has(j) ? C.sel.delete(j) : C.sel.add(j); renderCommas(); });
  const ck = $("#c-check", root); if (ck) ck.onclick = () => {
    const s = SBANK[C.cur];
    const ok = s.commas.length === C.sel.size && s.commas.every(j => C.sel.has(j));
    C.res = { ok }; recordSent(s, ok); renderCommas();
  };
  root.querySelectorAll("[data-cc]").forEach(b => b.onclick = () => {
    const s = SBANK[C.cur]; const ok = +b.dataset.cc === s.commas.length;
    C.res = { ok }; recordSent(s, ok); renderCommas();
  });
  const nx = $("#c-next", root); if (nx) { nx.onclick = nextSent; nx.focus({ preventScroll: true }); }
  const ag = $("#c-again", root); if (ag) ag.onclick = startCommas;
  root.querySelectorAll("[data-eg]").forEach(b => b.onclick = e => {
    const chip = e.target.closest("[data-rule16]");
    if (chip) { C.ege.open = C.ege.open === chip.dataset.rule16 ? null : chip.dataset.rule16; renderCommas(); return; }
    if (C.ege.done) return;
    const i = +b.dataset.eg; C.ege.sel.has(i) ? C.ege.sel.delete(i) : C.ege.sel.add(i); renderCommas();
  });
  const ec = $("#e-check", root); if (ec) ec.onclick = () => {
    const E = C.ege; E.done = true;
    E.list.forEach((id, i) => { const s = SBANK[id]; const ok = (s.commas.length === 1) === E.sel.has(i + 1); const st = sst(id); S.total.n++; if (ok) { S.total.ok++; st.ok++; st.streak++; } else { st.bad++; st.streak = 0; } });
    save(); renderStats(); renderCommas();
  };
  const en = $("#e-new", root); if (en) en.onclick = () => { C.ege = genEge(); renderCommas(); };
  root.querySelectorAll("[data-drill16]").forEach(b => b.onclick = () => drill16(b.dataset.drill16));
}
function drill16(id) { C.rule = id; C.source = "all"; if (C.mode === "ege") C.mode = "place"; showTab("commas"); startCommas(); }

/* ---------- Старт ---------- */
renderStats();
startRound();
renderRowsTab();
renderTest();
let startTab = "words";
try { startTab = localStorage.getItem(KEY + "-tab") || "words"; } catch (e) {}
showTab(["words", "rows", "test", "commas", "rules"].includes(startTab) ? startTab : "words");
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
