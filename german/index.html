<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Немецкий A1</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600&family=PT+Serif:wght@400;700&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
:root {
  --paper: #f6f3ef; --grid: #e8e1d8; --sheet: #ffffff; --text: #221c1a; --muted: #6c625d; --line: #ddd4cb;
  --ink: #9c2a3c; --ink-soft: #f6e6e8; --gold: #b7860b; --gold-soft: #fbf1d6;
  --bad: #c9372c; --bad-soft: #fbe8e6; --ok: #23784a; --ok-soft: #e3f3e9;
  --g-m: #2c5bc9; --g-f: #c9372c; --g-n: #23824a;
  --f-hand: "Caveat", "Segoe Print", cursive;
  --f-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-word: "PT Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14110f; --grid: #1e1a17; --sheet: #1c1816; --text: #ede6e1; --muted: #a59a93; --line: #362f2b;
    --ink: #ff8fa0; --ink-soft: #3a2228; --gold: #e8bd4a; --gold-soft: #33290f;
    --bad: #ff7b6e; --bad-soft: #3b1f1c; --ok: #64d396; --ok-soft: #163024;
    --g-m: #8fb0ff; --g-f: #ff8a7e; --g-n: #6fd69c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14110f; --grid: #1e1a17; --sheet: #1c1816; --text: #ede6e1; --muted: #a59a93; --line: #362f2b;
  --ink: #ff8fa0; --ink-soft: #3a2228; --gold: #e8bd4a; --gold-soft: #33290f;
  --bad: #ff7b6e; --bad-soft: #3b1f1c; --ok: #64d396; --ok-soft: #163024;
  --g-m: #8fb0ff; --g-f: #ff8a7e; --g-n: #6fd69c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; color: var(--text); font: 16px/1.5 var(--f-ui);
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
h1 { font: 700 30px/1.1 var(--f-word); margin: 0; }
.sub { font: 500 22px/1 var(--f-hand); color: var(--ink); }
.stats { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font: 500 15px var(--f-ui); color: var(--muted); background: transparent; border: 1px solid transparent; padding: 7px 13px; border-radius: 8px; cursor: pointer; }
@media (max-width: 420px) { .tab { font-size: 14px; padding: 6px 7px; white-space: nowrap; } .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; } }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); border-color: var(--line); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 22px 22px 26px; min-width: 0; box-shadow: 0 10px 30px -20px rgba(40, 20, 10, .4); }
@media (max-width: 560px) { .sheet { padding: 18px 16px 22px; } }
h2 { font: 700 22px/1.25 var(--f-word); margin: 0 0 10px; }
h3 { font: 600 17px/1.3 var(--f-ui); margin: 22px 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.hand { font: 700 22px/1.1 var(--f-hand); color: var(--ink); }

.btn { font: 600 15px var(--f-ui); background: var(--ink); color: var(--sheet); border: 0; border-radius: 9px; padding: 11px 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.center { justify-content: center; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.grades button { font: 600 15px var(--f-ui); border-radius: 9px; padding: 12px 6px; cursor: pointer; border: 1.5px solid var(--line); background: var(--sheet); color: var(--text); }
.grades .g0 { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.grades .g1 { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.grades .g2 { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.progress i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.ptext { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
.kind { font: 700 20px var(--f-hand); color: var(--gold); text-align: center; margin-top: 14px; }
.big { font: 400 clamp(26px, 6.5vw, 38px)/1.25 var(--f-word); text-align: center; padding: 14px 0 6px; overflow-wrap: anywhere; }
.big.de { cursor: pointer; }
.ru { font-size: 19px; text-align: center; }
.note { background: var(--gold-soft); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; margin: 12px 0 0; }
.speak { display: flex; gap: 8px; justify-content: center; margin: 6px 0 4px; flex-wrap: wrap; }
.speak button, .play { font: 500 14px var(--f-ui); color: var(--ink); background: var(--ink-soft); border: 0; border-radius: 99px; padding: 7px 14px; cursor: pointer; }
.heard { text-align: center; font-size: 14.5px; min-height: 0; margin-top: 6px; }
.heard.ok { color: var(--ok); } .heard.bad { color: var(--bad); }
.reveal { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }

.de { color: var(--ink); cursor: pointer; font-family: var(--f-word); }
span.de, b.de { text-decoration: underline dotted; text-underline-offset: 3px; }
.g-m { color: var(--g-m); font-weight: 700; } .g-f { color: var(--g-f); font-weight: 700; } .g-n { color: var(--g-n); font-weight: 700; }

.readbox { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.readbox .w { font: 22px var(--f-word); text-align: center; margin-bottom: 10px; line-height: 1.6; }
.readbox mark { background: var(--gold-soft); color: inherit; border-radius: 3px; padding: 0 1px; border-bottom: 2px solid var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13.5px var(--f-ui); border: 1px solid var(--line); background: var(--sheet); color: var(--text); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
.chip b { font-family: var(--f-word); color: var(--ink); }

.opts { display: grid; gap: 8px; margin-top: 16px; }
.opts button { font: 16px var(--f-ui); text-align: left; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--text); cursor: pointer; }
.opts button.right { border-color: var(--ok); background: var(--ok-soft); }
.opts button.wrong { border-color: var(--bad); background: var(--bad-soft); }

.answer { min-height: 54px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; justify-content: center; margin-top: 14px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.tile { font: 19px var(--f-word); padding: 7px 13px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--text); cursor: pointer; box-shadow: 0 2px 0 var(--line); }
.tile.used { visibility: hidden; }
.verdict { text-align: center; margin-top: 14px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

.lessons { display: grid; gap: 8px; }
.lesson { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); color: var(--text); cursor: pointer; font: inherit; }
.lesson .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--f-ui); background: var(--ink-soft); color: var(--ink); }
.lesson.done .n { background: var(--ok-soft); color: var(--ok); }
.lesson b { display: block; font-size: 16px; }
.lesson span { color: var(--muted); font-size: 13.5px; }
.lesson .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.theory { font-size: 15.5px; }
.theory table, .tbl { border-collapse: collapse; margin: 8px 0 14px; font-size: 15px; }
.theory td, .theory th, .tbl td, .tbl th { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
.theory th, .tbl th { background: var(--ink-soft); font-weight: 600; }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.phrases { display: grid; gap: 0; margin-top: 6px; }
.ph { display: grid; grid-template-columns: 36px 1fr 10px; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ph .play { padding: 0; width: 34px; height: 34px; }
.ph .dd { font: 18px var(--f-word); cursor: pointer; }
.ph .rr { font-size: 14.5px; color: var(--muted); }
.ph .nn { font-size: 13.5px; color: var(--gold); margin-top: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 8px; }
.dot.s1 { background: var(--gold); } .dot.s2 { background: var(--ok); }

.rule { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; scroll-margin-top: 16px; transition: box-shadow .4s; }
.rule.flash { box-shadow: 0 0 0 3px var(--gold); }
.rule h3 { margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rule h3 code { font: 700 18px var(--f-word); color: var(--ink); background: var(--ink-soft); padding: 0 7px; border-radius: 6px; }
.rule .bad { background: var(--bad-soft); border-radius: 8px; padding: 7px 10px; font-size: 14.5px; margin: 8px 0; }
.ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ex button { font: 15px var(--f-ui); border: 1px solid var(--line); background: var(--sheet); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.ex button b { font: 700 17px var(--f-word); color: var(--ink); font-weight: 400; }
.ex button span { color: var(--muted); font-size: 13px; }
.drill { border: 1.5px solid var(--gold); background: var(--gold-soft); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.pair button { font: 22px var(--f-word); padding: 12px 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--text); cursor: pointer; }
.pair button.right { border-color: var(--ok); background: var(--ok-soft); }
.pair button.wrong { border-color: var(--bad); background: var(--bad-soft); }
.warn { background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.settings { display: grid; gap: 10px; margin-top: 8px; font-size: 15px; }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
select { font: 15px var(--f-ui); color: var(--text); background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.today-num { font: 700 46px/1 var(--f-word); color: var(--ink); }
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 12px 0 16px; }
.plan div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.plan span { display: block; font-size: 13px; color: var(--muted); }
.lnav { display: flex; justify-content: space-between; gap: 6px; }
.lnav .btn { padding: 7px 10px; }
.focus { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); margin-top: 16px; }
.focus select { width: 100%; }
.cur { display: block; font-size: 11.5px; color: var(--gold); font-weight: 600; }
details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 18px; }
summary { cursor: pointer; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Немецкий A1</h1>
      <div class="sub">понимать, а не зубрить</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">Сегодня</button>
    <button class="tab" role="tab" data-tab="lessons" aria-selected="false">Уроки</button>
    <button class="tab" role="tab" data-tab="pron" aria-selected="false">Произношение</button>
    <button class="tab" role="tab" data-tab="sheet" aria-selected="false">Шпаргалка</button>
  </nav>
  <section class="sheet" id="p-today"></section>
  <section class="sheet" id="p-lessons" hidden></section>
  <section class="sheet" id="p-pron" hidden></section>
  <section class="sheet" id="p-sheet" hidden></section>
</div>

<script>
const D = s => `<span class="de">${s}</span>`;

const LESSONS = [
{ id: "hallo", title: "Первые фразы", sub: "привет, спасибо, как дела",
theory: `<p>Главное про немецкий: он <b>читается по правилам</b>. Выучи ~20 правил во вкладке «Произношение» — и сможешь правильно прочитать любое слово, даже незнакомое. Проходи её параллельно с первыми уроками.</p>
<p>Сразу три вещи:</p>
<p>1) Ударение почти всегда на <b>первый слог</b>: ${D("Abend")}, ${D("danke")}, ${D("Morgen")}.<br>
2) Все <b>существительные — с большой буквы</b>: ${D("der Tag")}, ${D("die Nacht")}.<br>
3) Гласные бывают <b>долгими и краткими</b>, и это меняет смысл: ${D("Staat")} (государство) и ${D("Stadt")} (город).</p>
<p>${D("Guten Tag")} — вежливо, со взрослыми и незнакомыми. ${D("Hallo")} — почти везде. ${D("Tschüss")} — «пока» для своих. На юге Германии и в Австрии услышишь ${D("Servus")} и ${D("Grüß Gott")}.</p>
<p>На ${D("Wie geht's?")} отвечают коротко: ${D("Gut, danke. Und dir?")} — и это не вопрос «как прошёл день», а просто вежливость, как в английском.</p>`,
items: [
["Hallo!", "Привет!"], ["Guten Morgen!", "Доброе утро!"], ["Guten Tag!", "Добрый день!", "Вежливо, со взрослыми и незнакомыми."],
["Guten Abend!", "Добрый вечер!"], ["Gute Nacht!", "Спокойной ночи!"], ["Tschüss!", "Пока!"],
["Auf Wiedersehen!", "До свидания!"], ["Danke!", "Спасибо!"], ["Danke schön!", "Большое спасибо!"],
["Bitte!", "Пожалуйста! / Не за что!", "Bitte — и просьба, и ответ на «спасибо»."], ["Entschuldigung!", "Извините!"],
["Ja.", "Да."], ["Nein.", "Нет."], ["Wie geht's?", "Как дела?"], ["Gut, danke.", "Хорошо, спасибо."], ["Und dir?", "А у тебя?"]
]},
{ id: "kennen", title: "Знакомство", sub: "имя, откуда, сколько лет",
theory: `<p><b>Ты и Вы.</b> ${D("du")} — «ты»: друзьям, сверстникам, семье. ${D("Sie")} с большой буквы — вежливое «Вы» (к одному или нескольким), глагол стоит в форме «они»: ${D("Wie heißen Sie?")}. Немецкие подростки между собой всегда на du, к учителю и продавцу — на Sie.</p>
<p><b>Окончания глагола</b> уже видны: ${D("ich komme")}, ${D("du kommst")}. Подробно — в уроке 4.</p>
<p><b>Возраст</b> — через «быть», а не «иметь»: ${D("Ich bin 16 Jahre alt")} = «я 16 лет стар». Типичная ошибка русских — <s>Ich habe 16 Jahre</s>.</p>
<p><b>Откуда и где:</b> ${D("aus")} — откуда (${D("Ich komme aus Russland")}), ${D("in")} — где (${D("Ich wohne in Moskau")}).</p>
<p>Две фразы-спасателя выучи первыми: ${D("Ich verstehe nicht")} и ${D("Langsamer, bitte")}. С ними любой разговор не развалится.</p>`,
items: [
["Wie heißt du?", "Как тебя зовут?"], ["Ich heiße Max.", "Меня зовут Макс."], ["Wie heißen Sie?", "Как вас зовут?", "Вежливая форма: Sie + глагол как у «они»."],
["Ich bin Anna.", "Я Анна."], ["Woher kommst du?", "Откуда ты?"], ["Ich komme aus Russland.", "Я из России."],
["Wo wohnst du?", "Где ты живёшь?"], ["Ich wohne in Berlin.", "Я живу в Берлине."], ["Wie alt bist du?", "Сколько тебе лет?"],
["Ich bin sechzehn Jahre alt.", "Мне шестнадцать лет.", "Дословно «я шестнадцать лет стар». Не haben!"], ["Freut mich!", "Очень приятно!"],
["Ich spreche ein bisschen Deutsch.", "Я немного говорю по-немецки."], ["Ich verstehe nicht.", "Я не понимаю."],
["Kannst du das wiederholen?", "Можешь повторить?"], ["Langsamer, bitte.", "Помедленнее, пожалуйста."]
]},
{ id: "sein", title: "Глагол sein — «быть»", sub: "я есть, ты есть, он есть",
theory: `<p>В русском «я студент» — без глагола. В немецком <b>глагол обязателен всегда</b>: ${D("Ich bin Schüler")} = «я есть школьник». Без него фраза ломается.</p>
<div class="tscroll"><table><tr><th>кто</th><th>sein</th><th></th></tr>
<tr><td>${D("ich")} — я</td><td>${D("bin")}</td><td>${D("Ich bin müde.")}</td></tr>
<tr><td>${D("du")} — ты</td><td>${D("bist")}</td><td>${D("Du bist nett.")}</td></tr>
<tr><td>${D("er / sie / es")} — он / она / оно</td><td>${D("ist")}</td><td>${D("Er ist hier.")}</td></tr>
<tr><td>${D("wir")} — мы</td><td>${D("sind")}</td><td>${D("Wir sind Schüler.")}</td></tr>
<tr><td>${D("ihr")} — вы (компания)</td><td>${D("seid")}</td><td>${D("Ihr seid zu spät.")}</td></tr>
<tr><td>${D("sie / Sie")} — они / Вы</td><td>${D("sind")}</td><td>${D("Sie sind nett.")}</td></tr></table></div>
<p><b>Профессии и роли — без артикля:</b> ${D("Ich bin Schüler")}, а не <s>ein Schüler</s>.</p>
<p><b>«Холодно», «поздно»</b> — в немецком нужно подлежащее, ставят пустое ${D("es")}: ${D("Es ist kalt")}. Предложение без подлежащего немцу режет слух.</p>
<p>Вопрос «да/нет» — глагол вперёд: ${D("Du bist müde")} → ${D("Bist du müde?")}</p>`,
items: [
["Ich bin müde.", "Я устал."], ["Du bist nett.", "Ты милый."], ["Er ist mein Bruder.", "Он мой брат."],
["Sie ist meine Schwester.", "Она моя сестра."], ["Das ist mein Freund.", "Это мой друг."], ["Wir sind Schüler.", "Мы школьники.", "Профессии и роли — без артикля."],

{ id: "artikel", title: "Род: der, die, das", sub: "артикль — часть слова", gender: true,
theory: `<p>У каждого существительного есть род, и он <b>часто не совпадает с русским</b>: ${D("die Sonne")} (ж.), ${D("der Mond")} (м.), ${D("das Mädchen")} (ср.! «девочка»).</p>

<tr><td>множ. число</td><td>${D("die")}</td><td>—</td></tr></table></div>
<p><b>Главное правило: учи слово только вместе с артиклем.</b> Не «Tisch — стол», а «<span class="g-m">der</span> Tisch». Здесь артикли раскрашены: <span class="g-m">der синий</span>, <span class="g-f">die красный</span>, <span class="g-n">das зелёный</span> — представляй слово этого цвета.</p>
<p>Подсказки, которые работают почти всегда:</p>
<p>• <span class="g-f">die</span>: на <b>-ung, -heit, -keit, -schaft, -ion, -tät</b> (${D("die Zeitung")}, ${D("die Information")}) и большинство на <b>-e</b> (${D("die Schule")}).<br>
• <span class="g-n">das</span>: на <b>-chen, -lein</b> (уменьшительные: ${D("das Mädchen")}), почти все на <b>-um</b>, <b>-ment</b>.<br>
• <span class="g-m">der</span>: дни, месяцы, времена года (${D("der Montag")}, ${D("der Mai")}), слова на <b>-er</b> про людей (${D("der Lehrer")}).</p>
<p>${D("der/die/das")} — «тот самый, известный»; ${D("ein/eine")} — «какой-то, один». ${D("Das ist ein Hund. Der Hund ist groß.")} — сначала «какая-то собака», потом «эта собака».</p>`,

<p>${D("Ich kann gut schwimmen.")}<br>${D("Ich muss morgen früh in die Schule gehen.")}</p>
<p>Между ними — всё остальное. Немец часто узнаёт главный смысл только в конце фразы — поэтому немцы слушают до конца и не перебивают.</p>
<p><b>Ловушки:</b><br>
• ${D("ich will")} — «я хочу», а не «я буду» (как английское will). Звучит резковато; вежливо — ${D("ich möchte")}.<br>

theory: `<p>У многих глаголов есть приставка, которая в предложении <b>отрывается и улетает в конец</b>. Это та же «рамка», что у модальных:</p>

${D("anrufen")} — звонить → ${D("Ich rufe dich später an.")}<br>
${D("einkaufen")} — закупаться → ${D("Wir kaufen heute ein.")}</p>
<p>Отделяемые приставки — это обычные маленькие слова: <b>an, auf, aus, ein, mit, zu, ab, vor, weg, zurück, fern</b>. На них всегда <b>ударение</b>: <b>auf</b>stehen, <b>an</b>rufen.</p>
<p>Не отделяются никогда (и безударны): <b>be-, ver-, er-, ge-, ent-, emp-, zer-, miss-</b>: ${D("verstehen")} → ${D("Ich verstehe das")}.</p>

<p>Отсюда главный совет: <b>дослушивай фразу до конца</b>. ${D("Ich mache das Licht …")} — ещё непонятно; ${D("… an")} — включаю, ${D("… aus")} — выключаю.</p>`,

<script>
const KEY = "de-a1-v1";
const DAY = 86400000;
const IV = [0, 1, 2, 4, 8, 16, 35, 75, 150, 300];
const CARDS = {};
const ORDER = [];
LESSONS.forEach((L, li) => L.items.forEach((it, i) => {

}));
const RULE_TITLE = {};

let S = { c: {}, read: {}, day: { d: "", n: 0, r: 0 }, streak: { last: "", n: 0 }, set: { newPerDay: 8, rate: 0.9, auto: true } };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const o = JSON.parse(raw); S = Object.assign(S, o); S.set = Object.assign({ newPerDay: 8, rate: 0.9, auto: true }, o.set || {}); }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
const today = () => dayKey(Date.now());
const yesterday = () => dayKey(Date.now() - DAY);
function syncDay() { if (S.day.d !== today()) S.day = { d: today(), n: 0, r: 0 }; }
function streakNow() { return (S.streak.last === today() || S.streak.last === yesterday()) ? S.streak.n : 0; }
function touchStreak() {
  if (S.streak.last === today()) return;
  S.streak.n = S.streak.last === yesterday() ? S.streak.n + 1 : 1;
  S.streak.last = today();
}

const TTS = { ok: "speechSynthesis" in window, voice: null, loaded: false };
const NOVELTY = /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox/i;
function loadVoices() {
  if (!TTS.ok) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  TTS.loaded = true;
  const de = vs.filter(v => /^de([-_]|$)/i.test(v.lang));
  const pool = de.filter(v => !NOVELTY.test(v.name));
  const score = v => (/de[-_]DE/i.test(v.lang) ? 4 : 0) + (/premium|enhanced|natural|neural|erweitert/i.test(v.name) ? 3 : 0) + (/Anna|Helena|Katja|Petra|Google|Markus|Yannick/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);
  TTS.voice = (pool.length ? pool : de).sort((a, b) => score(b) - score(a))[0] || null;
  document.querySelectorAll(".voice-note").forEach(el => el.innerHTML = voiceNote());
}
if (TTS.ok) { loadVoices(); speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", loadVoices) : (speechSynthesis.onvoiceschanged = loadVoices); setTimeout(loadVoices, 600); }
function hasVoice() { return TTS.ok && (!!TTS.voice || !TTS.loaded); }
function say(text, slow) {
  if (!TTS.ok) return;
  const clean = String(text).replace(/[«»„“"]/g, "").replace(/\s+[–—-]\s+/g, ", ").replace(/\s*\/\s*/g, ", ").replace(/\s*→\s*/g, ", ");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "de-DE";
  if (TTS.voice) u.voice = TTS.voice;
  u.rate = slow ? 0.55 : S.set.rate;
  speechSynthesis.speak(u);
}
function voiceNote() {
  if (!TTS.ok) return `<div class="warn">Этот браузер не умеет озвучивать текст. Открой страницу в Safari или Chrome.</div>`;
  if (TTS.loaded && !TTS.voice) return `<div class="warn">Не найден немецкий голос. На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → Немецкий → скачай «Anna» (лучше «улучшенный»). Потом перезапусти страницу.</div>`;

const LOAN_V = new Set(["vase", "klavier", "universität", "video", "november", "vanille", "villa", "visum", "vulkan", "privat", "interview", "nervös", "virus", "vegetarier", "reservieren", "oliven", "evangelisch", "silvester"]);
const H_SOUND = new Set(["woher", "wohin", "daher", "dahin", "freiheit", "hoheit"]);
const ST_PREF = ["ver", "be", "ge", "auf", "an", "aus", "ein", "mit", "zu", "vor", "ab", "ent", "aufge", "ausge", "ange", "einge", "mitge", "abge", "zuge", "vorge", "bahn"];

function stStart(w, i) {
  if (i === 0) return true;
  return ST_PREF.includes(w.slice(0, i)) && /^(steh|stand|stell|stimm|stör|sprech|sproch|sprach|spiel|stieg|steig)/.test(w.slice(i));

function analyzeWord(word) {
  const w = word.toLowerCase(), n = w.length, segs = [];
  let i = 0;
  while (i < n) {
    const rest = w.slice(i), prev = w[i - 1] || "", next = w[i + 1] || "";

    else if (rest.startsWith("sch")) m = [3, "ш", "sch"];
    else if (/^s[pt]/.test(rest) && stStart(w, i)) m = [2, rest[1] === "p" ? "шп" : "шт", "spst"];
    else if (rest.startsWith("chs")) m = [3, "кс", "ch"];
    else if (rest.startsWith("ch") && i > 0) {
      const back = "aou".includes(prev) && !(prev === "u" && "eä".includes(w[i - 2] || ""));
      m = [2, back ? "х" : "хь", "ch"];
    }
    else if (rest === "ig" && n > 3) m = [2, "ихь", "ig"];
    else if (rest.startsWith("ei") || rest.startsWith("ai")) m = [2, "ай", "ei"];
    else if (rest.startsWith("ie")) m = [2, "ии", "ei"];
    else if (rest.startsWith("eu") || rest.startsWith("äu")) m = [2, "ой", "eu"];
    else if (rest.startsWith("au")) m = [2, "ау", "au"];
    else if (rest.startsWith("tion")) m = [4, "цион", "z"];
    else if (rest.startsWith("tz")) m = [2, "ц", "z"];
    else if (rest[0] === "z") m = [1, "ц", "z"];
    else if (rest[0] === "ß" || rest.startsWith("ss")) m = [rest[0] === "ß" ? 1 : 2, "с", "ss"];
    else if (rest.startsWith("qu")) m = [2, "кв", "jq"];
    else if (rest.startsWith("ph")) m = [2, "ф", "misc"];
    else if (rest.startsWith("th") && i === 0) m = [2, "т", "misc"];
    else if (rest.startsWith("ck")) m = [2, "к", "misc"];
    else if (rest.startsWith("ng") && !/^(an|ein|hin)ge/.test(w)) m = [2, "носовое н", "ng"];
    else if (rest[0] === "s" && VOW.includes(next) && (i === 0 || VOW.includes(prev) || "lnr".includes(prev)) && !(w.startsWith("haus") && i === 3)) m = [1, "з", "s"];
    else if (rest[0] === "v") m = [1, LOAN_V.has(w) ? "в" : "ф", "vw"];
    else if (rest[0] === "w") m = [1, "в", "vw"];
    else if (rest[0] === "j") m = [1, "й", "jq"];
    else if (rest[0] === "h") {
      if (i > 0 && VOW.includes(prev) && !H_SOUND.has(w)) m = [1, "не читается", "h"];
      else if (i === 0) m = [1, "выдох", "h"];

    else if ("äöü".includes(rest[0])) m = [1, rest[0] === "ä" ? "э" : rest[0], "umlaut"];

    else if (i === 1 && /^(ver|zer)/.test(w) && rest.startsWith("er")) m = [2, "эа", "r"];
    else if (rest[0] === "r") {

}
function readingHTML(de) {
  const chips = new Map();

    <p class="small muted" style="margin-top:18px">Выучено надёжно: <b>${learned}</b> из ${ORDER.length} фраз · начато: ${seen}</p>
    <details><summary>Как это работает</summary>
      <p class="small" style="margin-top:8px">• Ты учишь не отдельные слова, а <b>целые фразы</b> — так сразу видна грамматика и слова не путаются.<br>
      • Перед новыми фразами — короткое объяснение <b>почему так</b>.<br>
      • Каждую фразу слушай и <b>повторяй вслух</b>. Кнопка 🎙 проверит, понимает ли тебя немецкое распознавание речи.<br>
      • Приложение само решает, когда что повторить: то, что знаешь хорошо, — реже (через 2, 4, 8, 16 дней…), то, что забыл, — чаще. Поэтому хватает <b>5–10 минут в день</b>.<br>
      • Пропустил день — ничего страшного, повторения просто подождут.</p></details>
    <details><summary>Настройки</summary><div class="settings">
      <label>Новых фраз в день <select id="set-new">${[3, 5, 8, 10, 15, 20].map(v => `<option value="${v}"${v === S.set.newPerDay ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>Скорость речи <select id="set-rate">${[[0.7, "медленно"], [0.8, "чуть медленнее"], [0.9, "обычно"], [1, "быстро"]].map(([v, t]) => `<option value="${v}"${v === S.set.rate ? " selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Озвучивать автоматически <input type="checkbox" id="set-auto"${S.set.auto ? " checked" : ""}></label>
      <button class="btn ghost small" data-act="reset" style="justify-self:start">Сбросить весь прогресс</button>
    </div></details>`;
}

let openLesson = null;
function renderLessons() {
  const P = $("#p-lessons");
  if (openLesson == null) {
    P.innerHTML = `<h2>Уроки</h2><p class="small muted">Иди по порядку: каждый урок опирается на предыдущий. Новые фразы из уроков сами попадают в «Сегодня», но можно открыть любой урок и почитать объяснение заранее.</p>
    <div class="lessons">${LESSONS.map((L, i) => {
      const st = lessonStats(L);
      return `<button class="lesson${st.seen === st.total ? " done" : ""}" data-lesson="${i}"><div class="n">${i + 1}</div><div><b>${esc(L.title)}</b><span>${esc(L.sub)}</span></div><div class="cnt">${S.set.focus === i ? '<span class="cur">сейчас</span>' : ""}${st.seen}/${st.total}</div></button>`;
    }).join("")}</div>`;
    return;
  }
  const L = LESSONS[openLesson];
  S.read[L.id] = true; save();
  const st = lessonStats(L);
  const left = st.total - st.seen;
  const nav = `<div class="lnav"><button class="btn ghost small" data-goto="${openLesson - 1}"${openLesson === 0 ? " disabled" : ""}>← Урок ${openLesson}</button><button class="btn ghost small" data-act="back">Все уроки</button><button class="btn ghost small" data-goto="${openLesson + 1}"${openLesson === LESSONS.length - 1 ? " disabled" : ""}>Урок ${openLesson + 2} →</button></div>`;
  const isFocus = S.set.focus === openLesson;
  P.innerHTML = `${nav}
    <h2 style="margin-top:14px">Урок ${openLesson + 1}. ${esc(L.title)}</h2>
    <div class="theory">${L.theory}</div>
    <h3>Фразы урока</h3><p class="small muted">Нажми на фразу — услышишь её. Точка справа: серая — ещё не учил, жёлтая — учишь, зелёная — выучено.</p>
    <div class="phrases">${L.items.map((_, i) => {
      const id = L.id + "-" + i, c = CARDS[id];
      return `<div class="ph"><button class="play" data-say="${esc(c.de)}" aria-label="Слушать">▶</button><div><div class="dd" data-say="${esc(c.de)}">${deHTML(c)}</div><div class="rr">${esc(c.ru)}</div>${c.note ? `<div class="nn">${esc(c.note)}</div>` : ""}</div><div class="dot ${stageClass(id)}"></div></div>`;
    }).join("")}</div>
    <div class="row" style="margin-top:16px">
      ${left ? `<button class="btn" data-act="learn-lesson">Учить фразы урока (${left})</button>` : ""}
      ${st.seen ? `<button class="btn ghost" data-act="practice-lesson">Потренироваться</button>` : ""}
    </div>
    ${st.seen ? `<p class="small muted" style="margin-top:8px">«Потренироваться» не сбивает расписание повторений — просто прогон для себя.</p>` : ""}
    ${left ? (isFocus ? `<p class="small" style="margin-top:12px">✓ Новые фразы во вкладке «Сегодня» берутся из этого урока. <button class="chip" data-act="unfocus">Вернуть по порядку</button></p>` : `<div class="row" style="margin-top:12px"><button class="btn ghost small" data-act="focus">Брать новые фразы на «Сегодня» отсюда</button></div>`) : ""}
    <div style="margin-top:18px">${nav}</div>`;
}

let PD = { pair: null, pick: null, score: 0, total: 0 };
let SD = { pair: null, side: 0 };
function newPair() { PD.pair = PAIRS[Math.floor(Math.random() * PAIRS.length)]; PD.pick = Math.random() < 0.5 ? 0 : 1; PD.answered = false; }
function newSay() { SD.pair = PAIRS[Math.floor(Math.random() * PAIRS.length)]; SD.side = Math.random() < 0.5 ? 0 : 1; }
function drillHTML() {
  if (!PD.pair) newPair();
  const p = PD.pair;
  const word = i => p[i * 2];
  const res = PD.answered ? `<p class="small" style="margin:10px 0 0">${PD.answered === "ok" ? "✓ Верно." : "✗ Прозвучало другое."} ${D(p[0])} — ${p[1]}, ${D(p[2])} — ${p[3]}. Разница: <b>${p[4]}</b>.</p>
     <div class="row" style="margin-top:8px"><button class="btn small" data-act="pair-next">Следующая пара</button></div>` : "";
  return `<div class="drill"><b>Различи на слух</b> <span class="small muted">· ${PD.score}/${PD.total}</span>
    <p class="small" style="margin:4px 0 0">Тренирует ухо на звуки, которых нет в русском. Нажми «Слушать» и выбери слово.</p>
    <div class="speak" style="justify-content:flex-start;margin-top:10px"><button data-act="pair-play">▶ Слушать</button><button data-act="pair-slow">🐢 Медленно</button></div>
    <div class="pair">${[0, 1].map(i => {
      let cls = "";
      if (PD.answered) { if (i === PD.pick) cls = "right"; else if (PD.chosen === i) cls = "wrong"; }
      return `<button class="${cls}" data-pairpick="${i}"${PD.answered ? " disabled" : ""}>${esc(word(i))}</button>`;
    }).join("")}</div>${res}</div>`;
}
function sayDrillHTML() {
  if (!SRC) return "";
  if (!SD.pair) newSay();
  const p = SD.pair, w = p[SD.side * 2], gl = p[SD.side * 2 + 1], other = p[(1 - SD.side) * 2];
  return `<div class="drill speakwrap"><b>Произнеси так, чтобы тебя поняли</b>
    <p class="small" style="margin:4px 0 0">Скажи слово в микрофон. Если распознается как «${esc(other)}» — значит, звук не тот (${esc(p[4])}).</p>
    <div class="big de" style="font-size:30px" data-say="${esc(w)}">${esc(w)}</div><p style="text-align:center;margin:0" class="muted">${esc(gl)}</p>
    <div class="speak"><button data-say="${esc(w)}">▶ Образец</button><button data-say="${esc(w)}" data-slow="1">🐢</button><button data-mic="${esc(w)}">🎙 Сказать</button><button data-act="say-next">Другое слово</button></div><div class="heard"></div></div>`;
}
function renderPron() {
  $("#p-pron").innerHTML = `<div class="voice-note">${voiceNote()}</div><h2>Произношение</h2>
    <p>Немецкий читается <b>по правилам почти без исключений</b> — в отличие от английского. Выучи правила ниже, и сможешь правильно прочитать любое слово. В каждом правиле есть <b>типичная ошибка русских</b> — проверь, не делаешь ли ты её.</p>
    <p class="small muted">Нажимай на слова — их озвучит немецкий голос. Повторяй вслух сразу за ним.</p>
    <div id="drill1">${drillHTML()}</div><div id="drill2">${sayDrillHTML()}</div>
    ${PRON.map(g => `<h3>${esc(g.group)}</h3>` + g.items.map(r => `<div class="rule" id="r-${r.id}"><h3><code>${esc(r.k)}</code> ${esc(r.t)}</h3>${r.b}${r.bad ? `<div class="bad"><b>Ошибка:</b> ${esc(r.bad)}</div>` : ""}<div class="ex">${r.ex.map(([w, gl]) => `<button data-say="${esc(w)}"><b>${esc(w)}</b> <span>${esc(gl)}</span></button>`).join("")}</div></div>`).join("")).join("")}`;
}

function renderStats() {
  syncDay();
  const due = dueIds().length;
  $("#stats").innerHTML = `<span>серия <b>${streakNow()}</b> дн.</span><span>выучено <b>${ORDER.filter(id => S.c[id] && S.c[id].s >= 3).length}</b></span><span>к повторению <b>${due}</b></span>`;
}
let currentTab = "today";
function showTab(name) {
  currentTab = name;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  ["today", "lessons", "pron", "sheet"].forEach(t => $("#p-" + t).hidden = t !== name);
  if (name === "today") renderToday();
  if (name === "lessons") renderLessons();
  if (name === "pron") renderPron();
  if (name === "sheet") $("#p-sheet").innerHTML = SHEET;
  try { localStorage.setItem(KEY + "-tab", name); } catch (e) {}
}
function gotoRule(id) {
  showTab("pron");
  const el = $("#r-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-say], .de");
  if (!t) return;
  if (t.classList.contains("tab")) { showTab(t.dataset.tab); return; }
  if (t.dataset.mic) { startMic(t); return; }
  if (t.dataset.read) {
    const slot = t.closest(".speakwrap").querySelector(".readslot");
    slot.innerHTML = slot.innerHTML ? "" : readingHTML(t.dataset.read);
    return;
  }
  if (t.dataset.rule) { gotoRule(t.dataset.rule); return; }
  if (t.dataset.goto != null) { openLesson = Math.max(0, Math.min(LESSONS.length - 1, +t.dataset.goto)); renderLessons(); window.scrollTo(0, 0); return; }
  if (t.dataset.lesson) { openLesson = +t.dataset.lesson; renderLessons(); window.scrollTo(0, 0); return; }
  if (t.dataset.opt) {
    const it = cur();
    if (it.done) return;
    it.done = true;
    const right = t.dataset.opt === it.id;
    document.querySelectorAll("[data-opt]").forEach(b => { b.disabled = true; if (b.dataset.opt === it.id) b.classList.add("right"); });
    if (!right) t.classList.add("wrong");
    const c = CARDS[it.id];
    $("#rev").innerHTML = `<div class="reveal"><div class="big de" data-say="${esc(c.de)}" style="font-size:26px">${deHTML(c)}</div>${speakRow(c.de)}<div class="row center" style="margin-top:12px"><button class="btn" data-act="next">Дальше</button></div></div>`;
    if (right) W.ok++; else { W.bad++; requeue(it.id); }
    grade(it.id, right ? 2 : 0);
    return;
  }
  if (t.dataset.tile != null) { const it = cur(); const k = +t.dataset.tile; if (!it.ans.includes(k) && !it.done) { it.ans.push(k); drillTilesSafe(); } return; }
  if (t.dataset.un != null) { const it = cur(); if (!it.done) { it.ans.splice(+t.dataset.un, 1); drillTilesSafe(); } return; }
  if (t.dataset.grade != null) {
    const it = cur(), g = +t.dataset.grade;
    if (g === 2) W.ok++; else W.bad++;
    if (g === 0) requeue(it.id);
    if (it.test && g > 0) { if (!W.practice) { S.c[it.id].s = Math.max(S.c[it.id].s, g === 2 ? 1 : 0); S.c[it.id].due = g === 2 ? startOfDay(Date.now()) + DAY : Date.now(); if (g === 1) requeue(it.id); syncDay(); S.day.r++; save(); renderStats(); } }
    else grade(it.id, g);
    advance();
    return;
  }
  if (t.dataset.pairpick != null) {
    if (PD.answered) return;
    PD.chosen = +t.dataset.pairpick; PD.total++;
    if (PD.chosen === PD.pick) { PD.score++; PD.answered = "ok"; } else PD.answered = "bad";
    $("#drill1").innerHTML = drillHTML();
    return;
  }
  const act = t.dataset.act;
  if (act) {
    if (act === "start") startSession({});
    else if (act === "extra") startSession({ extra: 5 });
    else if (act === "next") advance();
    else if (act === "show") showAnswer();
    else if (act === "theory-ok") { S.read[LESSONS[cur().li].id] = true; save(); advance(); }
    else if (act === "quit") { W = null; renderToday(); renderStats(); }
    else if (act === "home") renderToday();
    else if (act === "to-lessons") { showTab("lessons"); }
    else if (act === "back") { openLesson = null; renderLessons(); }
    else if (act === "focus") { S.set.focus = openLesson; save(); renderLessons(); }
    else if (act === "unfocus") { S.set.focus = null; save(); renderLessons(); }
    else if (act === "learn-lesson") startSession({ lesson: openLesson });
    else if (act === "practice-lesson") startSession({ lesson: openLesson, practice: true });
    else if (act === "pair-play") say(PD.pair[PD.pick * 2]);
    else if (act === "pair-slow") say(PD.pair[PD.pick * 2], true);
    else if (act === "pair-next") { newPair(); $("#drill1").innerHTML = drillHTML(); say(PD.pair[PD.pick * 2]); }
    else if (act === "say-next") { newSay(); $("#drill2").innerHTML = sayDrillHTML(); }
    else if (act === "reset") {
      if (confirm("Точно стереть весь прогресс? Это нельзя отменить.")) { S.c = {}; S.read = {}; S.day = { d: today(), n: 0, r: 0 }; S.streak = { last: "", n: 0 }; save(); renderToday(); renderStats(); }
    }
    return;
  }
  const sayText = t.dataset.say || (t.classList.contains("de") ? t.textContent : null);
  if (sayText) say(sayText, !!t.dataset.slow);
});
function drillTilesSafe() { if (W && cur() && cur().mode === "build") drawTiles(); }
document.addEventListener("change", e => {
  if (e.target.id === "set-new") { S.set.newPerDay = +e.target.value; save(); renderToday(); }
  if (e.target.id === "set-rate") { S.set.rate = +e.target.value; save(); say("Guten Tag! Wie geht's?"); }
  if (e.target.id === "set-focus") { S.set.focus = e.target.value === "" ? null : +e.target.value; save(); renderToday(); }
  if (e.target.id === "set-auto") { S.set.auto = e.target.checked; save(); }
});

renderStats();
let startTab = "today";
try { startTab = localStorage.getItem(KEY + "-tab") || "today"; } catch (e) {}
showTab(["today", "lessons", "pron", "sheet"].includes(startTab) ? startTab : "today");
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
